<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhy Cosmetic - Links</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* بەکارهێنانی فۆنتی مۆدێرنی Vazirmatn */
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f2b36 0%, #a65d75 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 40px 20px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* --- ستایلی پارتاکڵ (تەنۆلکەکان) --- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* --- دیزاینی شوشەی تەواو ڕوون و شەفاف --- */
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover; /* وێنەکە ڕێکدەخات بەبێ ئەوەی پان یان درێژ بێتەوە */
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1); /* ڕەنگێکی کەم ئەگەر وێنەکە دیار نەبوو */
            display: inline-block;
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 35px;
            font-weight: 300; /* کێشی تەنک بۆ تاقلاینەکە */
            letter-spacing: 1px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 400;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeInUp 0.5s ease backwards;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* لادانی ڕەنگی شینی بنەڕەتی مۆبایل لە کاتی کلیک */
        }

        /* ئەنیمەیشنی تیشک (Shine Effect) */
        .link-card::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(30deg);
            transition: none;
        }

        .link-card:hover::after, .link-card:active::after {
            left: 120%;
            transition: all 0.6s ease-in-out;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }

        .link-card i {
            position: absolute;
            right: 15px;
            font-size: 17px;
            transition: transform 0.3s ease;
        }

        .link-card:hover, .link-card:active {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            background: #4f2b36; /* بەکارهێنانی ڕەنگی سەرەکی پاشبنەما */
            border-color: #a65d75; /* بەکارهێنانی ڕەنگی تەنیشتی پاشبنەما بۆ دەورەکەی */
        }

        .link-card:hover i, .link-card:active i {
            transform: scale(1.2);
            color: #ffffff !important; /* دڵنیابوونەوە لەوەی ئایکۆنەکە سپی دەبێتەوە */
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* ڕەنگی ئایکۆنەکان */
        .instagram i { color: #E1306C; }
        .snapchat i { color: #FFFC00; text-shadow: 0 0 2px black; }
        .tiktok i { color: #00f2ea; }
        .whatsapp i { color: #25D366; }
        .location i { color: #FF0000; }

        .logo-img {
            transition: transform 0.5s ease;
        }

        .logo-img:hover {
            transform: rotate(5deg) scale(1.05);
        }

        /* ڕێکخستنی تایبەت بۆ مۆبایلە زۆر بچووکەکان */
        @media (max-width: 380px) {
            .container {
                padding: 30px 15px;
                margin: 10px;
            }
            h1 { font-size: 24px; }
        }

        .footer-text {
            margin-top: 15px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.jpg.jpg" alt="Azhy Cosmetic" class="logo-img">
        </div>

        <h1>Azhy Cosmetic</h1>
        <p class="tagline">Beauty & Personal Care</p>

        <div class="links-list">
            <a href="https://www.instagram.com/azhy_cosmatic?igsh=Y2UxMHhjdm5vZG1i" class="link-card instagram" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
                ئینستاگرام
            </a>

            <a href="https://www.snapchat.com/add/azhy_cosmatic?share_id=ffHR6-iDtdM&locale=en-US" class="link-card snapchat" target="_blank" aria-label="Snapchat">
                <i class="fab fa-snapchat"></i>
                سناپچات
            </a>

            <a href="https://www.tiktok.com/@azhycosmetic?_r=1&_t=ZS-969lpvLgrjw" class="link-card tiktok" target="_blank" aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
                تیک تۆک
            </a>

            <a href="https://wa.me/9647515140542" class="link-card whatsapp" target="_blank" aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
                واتسئەپ
            </a>

            <a href="https://maps.app.goo.gl/4KupARdXiLqysasX8" class="link-card location" target="_blank" aria-label="Location">
                <i class="fas fa-map-marker-alt"></i>
                ناونیشان لەسەر نەخشە
            </a>
        </div>

        <p class="footer-text">© 2026 Azhy Cosmetic</p>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        // وەرگرتنی شوێنی ماوس
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        // پشتگیری کردنی دەست لێدان لە مۆبایل (Touch Events)
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // کاتێک ماوسەکە لە شاشەکە دەچێتە دەرەوە
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, isBurst = false) {
                this.init(x, y, isBurst);
            }
            init(x, y, isBurst) {
                this.x = x !== undefined ? x : Math.random() * canvas.width;
                this.y = y !== undefined ? y : Math.random() * canvas.height;
                // لێرەدا مەوداکەمان زیاد کردووە بۆ ئەوەی قەبارەکان لە نێوان 0.5 بۆ 4 پیکسڵ بن
                this.size = Math.random() * 3.5 + 0.5;

                if (isBurst) {
                    // تەنۆلکە نوێیەکان بە خێراییەکی زیاتر و ئاراستەی جیاواز بڵاو دەبنەوە
                    this.speedX = Math.random() * 4 - 2;
                    this.speedY = Math.random() * 4 - 2;
                    this.opacity = 1; // لە سەرەتادا ڕوونتر بن
                } else {
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = Math.random() * 0.5 - 0.25;
                    this.opacity = Math.random() * 0.5 + 0.2;
                }

                // دیاریکردنی ڕەنگ بە شێوەیەکی هەڕەمەکی (سپی یان پەمەیی کاڵ)
                this.color = Math.random() > 0.5 ? '255, 255, 255' : '255, 192, 203';
            }
            update() {
                // کاریگەری بریقەدانەوە (Twinkle)
                this.opacity += (Math.random() - 0.5) * 0.02;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.8) this.opacity = 0.8;

                // لۆژیکی ڕاکردن لە ماوس
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceRadius = 100; // ئەو بازنەیەی تێیدا تەنۆلکەکە کاردانەوەی دەبێت

                    if (distance < forceRadius) {
                        let force = (forceRadius - distance) / forceRadius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;
                        
                        this.x += directionX * force * 5; // خێرایی ڕاکردنەکە
                        this.y += directionY * force * 5;
                    }
                }

                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                // زیادکردنی ڕووناکی دەوروبەری تەنۆلکەکان
                ctx.shadowBlur = this.size * 5;
                ctx.shadowColor = `rgb(${this.color})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // پاککردنەوەی سێبەرەکە بۆ ئەدای باشتر
            }
        }

        // فەنکشن بۆ دروستکردنی تەنۆلکەی نوێ لە کاتی کلیک
        function createBurst(x, y) {
            const burstCount = 12; // ژمارەی ئەو تەنۆلکانەی لە یەک کاتدا دروست دەبن
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(x, y, true));
            }
            // بۆ ئەوەی ژمارەی تەنۆلکەکان زۆر نەبێت و سیستمەکە خاو نەکاتەوە
            if (particles.length > 800) {
                particles.shift(); // یەک یەک تەنۆلکە کۆنەکان لادەبات نەک هەموو گروپەکە پێکەوە
            }
        }

        window.addEventListener('mousedown', (e) => createBurst(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) createBurst(e.touches[0].clientX, e.touches[0].clientY);
        });

        function initParticles() {
            particles = [];
            // کەمکردنەوەی ئەم ژمارەیە دەبێتە هۆی زیادبوونی تەنۆلکەکان
            const count = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>

</body>
</html>
